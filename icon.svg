<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc5200;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  <!-- Steering Wheel -->
  <circle cx="256" cy="220" r="110" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="256" cy="220" r="24" fill="#ffffff"/>
  <!-- Spokes -->
  <line x1="256" y1="130" x2="256" y2="196" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="166" y1="220" x2="232" y2="220" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="346" y1="220" x2="280" y2="220" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="244" x2="256" y2="310" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <!-- Truck profile loading / ramp badge -->
  <g transform="translate(110, 320)">
    <!-- Flatbed truck -->
    <path d="M 0,40 L 190,40 L 210,15 L 250,15 L 250,55 L 0,55 Z" fill="#ffffff"/>
    <!-- Ramp -->
    <path d="M 190,40 L 290,75 L 290,80 L 190,45 Z" fill="#ffffff" opacity="0.8"/>
    <!-- Wheels -->
    <circle cx="40" cy="65" r="16" fill="#121214" stroke="#ffffff" stroke-width="6"/>
    <circle cx="150" cy="65" r="16" fill="#121214" stroke="#ffffff" stroke-width="6"/>
    <circle cx="185" cy="65" r="16" fill="#121214" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
